project:
  type: website
  output-dir: _site
  # Files copied verbatim into the published site.
  # CNAME keeps your custom domain (danielpallies.com) attached on every publish.
  resources:
    - CNAME

website:
  title: "Daniel Pallies"
  site-url: "https://danielpallies.com"
  description: "Postdoctoral researcher at Lingnan University, working at the intersections of value, metaphysics, and consciousness."
  navbar:
    background: light
    left:
      - text: "Home"
        href: index.qmd
      - text: "CV"
        href: cv.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "Monsters"
        href: monsters.qmd
    right:
      - icon: envelope
        href: "mailto:danielpallies@ln.edu.hk"
        aria-label: "Email"
  page-footer:
    left: "&copy; Daniel Pallies"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: false
    grid:
      body-width: 820px
    email-obfuscation: references
